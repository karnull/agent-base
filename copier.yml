_min_copier_version: "9.0.0"
_subdirectory: template

_envops:
  undefined: jinja2.StrictUndefined

# ---------------------------------------------------------------------------
# where the project goes; devenv fills these in
# ---------------------------------------------------------------------------

projects_dir:
  type: str
  help: "Folder holding every project"
  default: /home/karsh/Blackwall

project_name:
  type: str
  help: "Name of the project's folder inside the projects folder"

project_slug:
  type: str
  help: "Lower-case name for the container, the image and its folder in ~/.local/blackice/devenv"
  default: >-
    {{ project_name
       | lower
       | regex_replace('[^a-z0-9_-]+', '-')
       | regex_replace('^-+|-+$', '') }}

# ---------------------------------------------------------------------------
# asked
# ---------------------------------------------------------------------------

fork_url:
  type: str
  help: "Fork to clone as main/ (URL or owner/repo) — the agent's copy, not the upstream"
  validator: >-
    {% if not (fork_url | regex_search('^(https://github\.com/|git@github\.com:)?[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9._-]+/?$')) %}
    Expected https://github.com/owner/repo, git@github.com:owner/repo.git, or owner/repo.
    {% endif %}

character:
  type: str
  default: ""
  help: Character name the remote connection goes by, e.g. Alt Cunningham
  # \Z rather than $, which would let a trailing newline through
  validator: >-
    {% if character and not (character | regex_search("^[A-Za-z][A-Za-z .'-]{0,39}\Z")) %}
    letters, spaces, apostrophes, hyphens and full stops, 40 at most
    {% endif %}

# ---------------------------------------------------------------------------
# derived from the fork (when: false means these are never prompted)
# ---------------------------------------------------------------------------

fork_slug:
  type: str
  when: false
  default: >-
    {{ fork_url
       | regex_replace('^(https://github\.com/|git@github\.com:)', '')
       | regex_replace('/$', '')
       | regex_replace('\.git$', '') }}

character_slug:
  type: str
  when: false
  default: >-
    {{ character
       | lower
       | regex_replace('[^a-z0-9]+', '-')
       | regex_replace('^-+|-+$', '') }}

bot_account:
  type: str
  when: false
  default: "{{ fork_slug.split('/')[0] }}"

github_repo:
  type: str
  when: false
  default: "{{ fork_slug.split('/')[1] }}"

# ---------------------------------------------------------------------------
# set up the destination
# ---------------------------------------------------------------------------

_tasks:
  - command: >-
      [ -d main ] || git clone https://github.com/{{ fork_slug }}.git main
    when: "{{ _copier_operation == 'copy' }}"
  - command: >-
      [ -d .git ] || { git init -q && git add -A &&
      git commit -q -m "Generated from the agent template"; }
    when: "{{ _copier_operation == 'copy' }}"

_message_after_copy: |

  main/ is a clone of {{ fork_slug }}.
