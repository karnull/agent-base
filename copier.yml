_min_copier_version: "9.0.0"
_subdirectory: template

_envops:
  undefined: jinja2.StrictUndefined

# ---------------------------------------------------------------------------
# where the project lives
# ---------------------------------------------------------------------------

# saved as an answer because copier update renders in a temporary folder
project_path:
  type: str
  help: Full path of the project folder, the same on the host and in the container
  default: "{{ _copier_conf.dst_path | realpath }}"
  validator: >-
    {% if not project_path.startswith('/') %}
    Must be an absolute path.
    {% endif %}

# computed (when: false means these are never prompted)
projects_root:
  type: str
  when: false
  default: "{{ project_path | dirname }}"

project_dir:
  type: str
  when: false
  default: "{{ project_path | basename }}"

# docker only allows lowercase letters, digits, hyphens and underscores in compose names
project_slug:
  type: str
  when: false
  default: "{{ project_dir | lower | regex_replace('[^a-z0-9_-]+', '-') | regex_replace('^-+|-+$', '') }}"

# ---------------------------------------------------------------------------
# asked
# ---------------------------------------------------------------------------

project_name:
  type: str
  help: Project name, as you would say it out loud (e.g. Tokyo Burn Nvim)
  default: "{{ project_dir }}"
  validator: >-
    {% if not project_name.strip() %}
    Required.
    {% endif %}

fork_url:
  type: str
  help: "Fork to clone as main/ (URL or owner/repo) — the agent's copy, not the upstream"
  validator: >-
    {% if not (fork_url | regex_search('^(https://github\.com/|git@github\.com:)?[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9._-]+/?$')) %}
    Expected https://github.com/owner/repo, git@github.com:owner/repo.git, or owner/repo.
    {% endif %}

# ---------------------------------------------------------------------------
# derived from the fork
# ---------------------------------------------------------------------------

fork_slug:
  type: str
  when: false
  default: >-
    {{ fork_url
       | regex_replace('^(https://github\.com/|git@github\.com:)', '')
       | regex_replace('/$', '')
       | regex_replace('\.git$', '') }}

bot_account:
  type: str
  when: false
  default: "{{ fork_slug.split('/')[0] }}"

github_repo:
  type: str
  when: false
  default: "{{ fork_slug.split('/')[1] }}"

# ---------------------------------------------------------------------------
# clone the fork as main/, and track the generated files so copier update works
# ---------------------------------------------------------------------------

# both are skipped when they already exist, so an older project can be copied over
_tasks:
  - command: >-
      [ -d main ] || git clone https://github.com/{{ fork_slug }}.git main
    when: "{{ _copier_operation == 'copy' }}"
  - command: >-
      [ -d .git ] || { git init -q && git add -A &&
      git commit -q -m "Generated from the agent template"; }
    when: "{{ _copier_operation == 'copy' }}"

_message_after_copy: |

  {{ projects_root }}/{{ project_dir }}
    main/              origin = {{ fork_slug }}
    AGENTS.md
    .devcontainer/compose.yaml

  Update later with `copier update --trust` from this folder, then commit.
