_min_copier_version: "9.0.0"
_subdirectory: template

_envops:
  undefined: jinja2.StrictUndefined

# ---------------------------------------------------------------------------
# asked
# ---------------------------------------------------------------------------

fork_url:
  type: str
  help: "Fork to clone as main/ (URL or owner/repo) — the agent's copy, not the upstream"
  validator: >-
    {% if not (fork_url | regex_search('^(https://github\.com/|git@github\.com:)?[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9._-]+/?$')) %}
    Expected https://github.com/owner/repo, git@github.com:owner/repo.git, or owner/repo.
    {% endif %}

# ---------------------------------------------------------------------------
# derived from the fork (when: false means these are never prompted)
# ---------------------------------------------------------------------------

fork_slug:
  type: str
  when: false
  default: >-
    {{ fork_url
       | regex_replace('^(https://github\.com/|git@github\.com:)', '')
       | regex_replace('/$', '')
       | regex_replace('\.git$', '') }}

bot_account:
  type: str
  when: false
  default: "{{ fork_slug.split('/')[0] }}"

github_repo:
  type: str
  when: false
  default: "{{ fork_slug.split('/')[1] }}"

# ---------------------------------------------------------------------------
# set up the project folder, which is the destination itself
# ---------------------------------------------------------------------------

# copier update renders in a temporary folder, so the real path is written once
# to .devcontainer/.env here instead of into any template file
_tasks:
  - command: >-
      [ -f .devcontainer/.env ] || printf 'PROJECT_ROOT=%s\nPROJECT_SLUG=%s\n'
      "$(pwd -P)"
      "$(basename "$(pwd -P)" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9_-]\{1,\}/-/g; s/^-*//; s/-*$//')"
      > .devcontainer/.env
    when: "{{ _copier_operation == 'copy' }}"
  - command: >-
      [ -d main ] || git clone https://github.com/{{ fork_slug }}.git main
    when: "{{ _copier_operation == 'copy' }}"
  - command: >-
      [ -d .git ] || { git init -q && git add -A &&
      git commit -q -m "Generated from the agent template"; }
    when: "{{ _copier_operation == 'copy' }}"

_message_after_copy: |

  main/ is a clone of {{ fork_slug }}. Start the container with `devenv up`.
  Update later with `copier update --trust` from this folder, then commit.
